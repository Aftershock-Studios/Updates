name: Compile Poly Haven CC0 material pack
on:
  push:
    branches: [main]
    paths: ['.github/workflows/material-pack-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aftershock-materials-v1
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify real PBR texture maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, hashlib, json, zipfile
          catalog={'Grass':'leafy_grass','Sand':'aerial_beach_02','Rock':'aerial_rocks_02','Dirt':'forest_floor','Concrete':'concrete_floor_01','Asphalt':'aerial_asphalt_01','Brick':'brick_wall_02','Wood':'bark_brown_02'}
          maps={'albedo':('diff','albedo'),'normal_gl':('nor_gl','normal_gl'),'roughness':('rough','roughness')}
          hosts={'api.polyhaven.com','dl.polyhaven.org','cdn.polyhaven.com','dl.polyhaven.com'}
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  check(newurl)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def check(url):
              p=urllib.parse.urlsplit(url)
              if p.scheme!='https' or p.hostname not in hosts or p.username or p.password:raise ValueError('Unexpected asset URL')
          def fetch(url,limit):
              check(url)
              req=urllib.request.Request(url,headers={'User-Agent':'AftershockStudio/1.0 (Poly Haven CC0 material pack build)'})
              with urllib.request.build_opener(Redirect()).open(req,timeout=45) as r: data=r.read(limit+1)
              if len(data)>limit:raise ValueError('Download limit exceeded')
              return data
          manifest={}
          with zipfile.ZipFile('Aftershock_PolyHaven_Materials_1K.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name,slug in catalog.items():
                  try:
                      metadata=json.loads(fetch('https://api.polyhaven.com/files/'+slug,2*1024*1024))
                      files={}
                      for kind,aliases in maps.items():
                          candidates=[(ext,metadata.get(key,{}).get('1k',{}).get(ext)) for key in aliases for ext in ('jpg','png','jpeg')]
                          ext,info=next((ext,info) for ext,info in candidates if isinstance(info,dict) and info.get('url') and 0<info.get('size',info.get('size_bytes',0))<=8*1024*1024 and info.get('md5'))
                          data=fetch(info['url'],8*1024*1024)
                          if len(data)!=info.get('size',info.get('size_bytes')) or hashlib.md5(data).hexdigest()!=info['md5'].lower():raise ValueError('Provider checksum mismatch')
                          files[name+'/'+kind+'.'+ext]=data
                      for path,data in files.items():z.writestr(path,data)
                      manifest[name]={'source':'https://polyhaven.com/a/'+slug,'license':'CC0-1.0','files':{path:hashlib.sha256(data).hexdigest() for path,data in files.items()}}
                      print('Verified',name,flush=True)
                  except Exception as exc:print('Skipping',name,repr(exc),flush=True)
              if not manifest:raise SystemExit('No verified assets retrieved')
              z.writestr('manifest.json',json.dumps(manifest,indent=2))
              z.writestr('CREDITS.txt','Materials by Poly Haven (https://polyhaven.com), CC0 1.0. See manifest.json for original source pages and file hashes.')
          with zipfile.ZipFile('Aftershock_PolyHaven_Materials_1K.zip') as z:
              assert z.testzip() is None
          print('Compiled',len(manifest),'materials')
          PY
      - name: Publish optional scan library
        shell: bash
        run: |
          set -euo pipefail
          gh release create materials-v1 Aftershock_PolyHaven_Materials_1K.zip --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'Aftershock optional Poly Haven CC0 materials' --notes 'Verified 1K texture maps from Poly Haven. See the included manifest for exact materials and source pages. This is an optional asset library, not an engine update.' --latest=false
