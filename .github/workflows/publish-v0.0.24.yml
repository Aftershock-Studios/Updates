name: Publish Aftershock v0.0.24
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.0.24.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aftershock-release-v0.0.24
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retrieve and verify exact committed patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir patches
          cd patches
          for file in Aftershock_Update_0.0.23_to_0.0.24.zip SHA256SUMS RELEASE_NOTES.md; do
            gh api -H 'Accept: application/vnd.github+json' "repos/$GH_REPO/contents/patches/v0.0.24/$file?ref=$GITHUB_SHA" --jq '.content' | base64 --decode > "$file"
          done
          sha256sum --check SHA256SUMS
          unzip -t Aftershock_Update_0.0.23_to_0.0.24.zip
      - name: Publish World Materials & Meshes
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.0.24 patches/Aftershock_Update_0.0.23_to_0.0.24.zip --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'Aftershock v0.0.24 - World Materials & Meshes' --notes-file patches/RELEASE_NOTES.md
